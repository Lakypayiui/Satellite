[project]
name = "satellite"
version = "0.2.0"
description = "Satellite 2.0: framework de microagentes de IA especializados con grafos de ejecucion y contexto bajo demanda"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "typer>=0.9",
    "httpx>=0.27",
    "textual>=8.0",
    "rich>=13.7",
    # Consolas legacy de Windows: el click vendorizado de typer importa colorama
    # para envolver el ANSI (si falta, cualquier comando del CLI revienta).
    "colorama>=0.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
desktop = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
