[project]
name = "satellite"
version = "0.2.0"
description = "Satellite 2.0: framework de microagentes de IA especializados con grafos de ejecucion y contexto bajo demanda"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests del paradigma anterior importan `satellite_py` (paquete no presente
# en este repo). Se excluyen para que la colección de la suite no falle;
# ningún archivo de test fue modificado.
addopts = """
--ignore=tests/test_bridges.py
--ignore=tests/test_cli.py
--ignore=tests/test_context.py
--ignore=tests/test_context_schema.py
--ignore=tests/test_dispatcher.py
--ignore=tests/test_execution_log.py
--ignore=tests/test_expander.py
--ignore=tests/test_llm.py
--ignore=tests/test_optimizer.py
--ignore=tests/test_orchestrator.py
--ignore=tests/test_planner.py
--ignore=tests/test_registry.py
--ignore=tests/test_security.py
--ignore=tests/test_semantic.py
--ignore=tests/test_store.py
--ignore=tests/test_validation.py
--ignore=tests/test_web.py
"""
