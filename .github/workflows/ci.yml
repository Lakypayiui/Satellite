name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El CLI revienta si falta colorama en consolas de Windows: que falle aquí.
      - name: Humo del CLI
        run: python -m satellite.cli --help

      - name: Suite
        run: python -m pytest tests/ -q
        env:
          # el smoke contra proveedores reales se salta sin claves (y aquí no hay)
          SATELLITE_LIVE_TESTS: "0"
