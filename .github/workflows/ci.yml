name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Los iconos del empaquetado (desktop/build/) están ignorados por git y el script los
      # genera con Node puro (sin Electron ni display, así que no hace falta xvfb).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El CLI revienta si falta colorama en consolas de Windows: que falle aquí.
      - name: Humo del CLI
        run: python -m satellite.cli --help

      - name: Iconos del empaquetado (headless)
        working-directory: desktop
        run: npm run icons

      - name: Suite
        run: python -m pytest tests/ -q
        env:
          # el smoke contra proveedores reales se salta sin claves (y aquí no hay)
          SATELLITE_LIVE_TESTS: "0"
