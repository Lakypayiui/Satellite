name: Release

# Al publicar una etiqueta `v*` (p. ej. `git tag v0.2.0 && git push origin v0.2.0`) se
# generan los paquetes de la app completa (Electron + CLI + TUI + MCP, con el backend de
# Python congelado dentro) en cada sistema, y se adjuntan a un GitHub Release en borrador.
# También se puede lanzar a mano (sin release: los paquetes quedan como artefactos).
#
# PyInstaller no compila para otro sistema: cada paquete se construye en su runner.
# Los paquetes no van firmados (macOS pedirá «Abrir» con clic derecho la primera vez y
# Windows mostrará SmartScreen); la firma necesita certificados en los secretos del repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            builder: --mac --arm64
            extras: pyobjc-framework-ApplicationServices==12.2.2 pyobjc-framework-Quartz==12.2.2
          # Runner Intel: si GitHub retira la etiqueta `macos-13`, usar la Intel vigente.
          - name: macos-x64
            os: macos-13
            builder: --mac --x64
            extras: pyobjc-framework-ApplicationServices==12.2.2 pyobjc-framework-Quartz==12.2.2
          - name: windows-x64
            os: windows-latest
            builder: --win --x64
            extras: pywinauto==0.6.9
          - name: linux-x64
            os: ubuntu-22.04
            builder: --linux --x64
            extras: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dependencias de Python (lock) y PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pyinstaller==6.22.3 ${{ matrix.extras }}

      - name: Congelar el backend (satellite)
        shell: bash
        env:
          SATELLITE_PYTHON: python
        working-directory: desktop
        run: |
          npm ci
          npm run build:backend

      # El ejecutable congelado tiene que servir como CLI, TUI y backend sin el checkout.
      - name: Humo del ejecutable congelado
        shell: bash
        env:
          # La salida por tubería en Windows no es UTF-8 por defecto (✓, acentos).
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          exe="$GITHUB_WORKSPACE/dist-backend/satellite/satellite"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cd "$RUNNER_TEMP"
          export SATELLITE_HOME="$RUNNER_TEMP/home"
          "$exe" --help >/dev/null
          "$exe" init
          # Proveedor `fake`: el runtime arranca sin red, así `doctor` carga el catálogo
          # que viene dentro del binario (specs y prompts). Se busca "agentes" (ASCII):
          # "catálogo" lleva acento y no casa de forma fiable en la consola de Windows.
          mkdir -p .satellite/config
          printf '{"name":"fake","model":"m"}' > .satellite/config/config.json
          "$exe" doctor | tee doctor.txt
          grep -q "agentes" doctor.txt
          "$exe" tui --help >/dev/null

      - name: Empaquetar la app
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run icons
          npm run build
          npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: satellite-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.tar.gz

  release:
    name: GitHub Release (borrador)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear el release en borrador con los paquetes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Satellite $GITHUB_REF_NAME" \
            --notes "App completa: escritorio (Electron), CLI, TUI y servidor MCP en un solo paquete. Ver el README para instalar el comando \`satellite\` desde Ajustes → Mantenimiento → Terminal."
